name: Smoke Tests

# Vercel reports each deployment (Preview for branches/PRs, Production for main)
# to GitHub; this runs once the deployment is live, against its URL.
on:
  deployment_status:

jobs:
  smoke:
    name: smoke (${{ github.event.deployment.environment }})
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pytest requests

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pytest integration_tests/ -v
